[workspace]
resolver = "2"
members = [
    "services/order-service",
    "services/market-service",
    "frontend/trading-ui",
    "shared/proto-types"
]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-web = "4.9"
actix-cors = "0.7"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }